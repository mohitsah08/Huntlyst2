<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Circle (Warm Parchment Paper) -->
  <circle cx="32" cy="32" r="31" fill="#FFFDF9" stroke="#1E1B18" stroke-width="2" />

  <!-- Orange Sketched Outer Compass Ring -->
  <circle cx="32" cy="32" r="22" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6 2" fill="none" />

  <!-- Cardinal Points -->
  <polygon points="32,6 30,19 32,17 34,19" fill="#1E1B18" />
  <polygon points="32,58 33,45 32,47 31,45" fill="#1E1B18" />
  <polygon points="6,32 19,31 17,32 19,33" fill="#1E1B18" />
  <polygon points="58,32 45,31 47,32 45,33" fill="#1E1B18" />

  <!-- Central Serif H in Charcoal -->
  <path d="M 22 20 L 27 20 L 27 22 L 26 22 L 26 42 L 27 42 L 27 44 L 22 44 L 22 42 L 23 42 L 23 22 L 22 22 Z" fill="#1E1B18" />
  <path d="M 37 20 L 42 20 L 42 22 L 41 22 L 41 42 L 42 42 L 42 44 L 37 44 L 37 42 L 38 42 L 38 22 L 37 22 Z" fill="#1E1B18" />
  <rect x="25" y="30" width="14" height="3" fill="#1E1B18" />

  <!-- Diagonal Orange Directional Compass Needle -->
  <polygon points="32,32 30,29 46,13 35,32" fill="#FF6B35" stroke="#1E1B18" stroke-width="0.8" />
  <polygon points="32,32 34,35 18,51 29,32" fill="#E85A28" stroke="#1E1B18" stroke-width="0.8" />

  <!-- Center Pivot Rivet -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFDF9" stroke="#1E1B18" stroke-width="1" />
  <circle cx="32" cy="32" r="1.2" fill="#FF6B35" />
</svg>
