<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">An animated mark where four lines draw themselves outward from a center point like being sketched by a pen, each ending in a node that draws its own outline, then the lines undraw back to center in a continuous loop, with a rotating scan arc around the outer ring.</desc>


